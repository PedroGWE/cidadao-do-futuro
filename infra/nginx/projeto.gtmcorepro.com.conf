# Redireciona HTTP → HTTPS (sem proxy aqui, apenas redirect)
server {
    listen 80;
    listen [::]:80;
    server_name projeto.gtmcorepro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy para Next.js (3000) e API NestJS (3001)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name projeto.gtmcorepro.com;

    ssl_certificate     /etc/letsencrypt/live/projeto.gtmcorepro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projeto.gtmcorepro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy para a API NestJS — deve vir ANTES do location /
    location /api/ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy para o Next.js
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
